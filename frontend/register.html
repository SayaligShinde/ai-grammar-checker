<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card auth-box">

    <h2 class="heading-main">Register</h2>    
    
    <!-- IMPORTANT: Add IDs -->
    <input class="input-field" id="registerName" type="text" placeholder="Name">
    <input class="input-field" id="registerEmail" type="email" placeholder="Email">
    <input class="input-field" id="registerPassword" type="password" placeholder="Password">

    <!-- IMPORTANT: Add onclick -->
    <button class="btn-primary" onclick="register()">Register</button>

    <p style="margin-top: 20px;">
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>

<script src="script.js"></script>
</body>
</html>
